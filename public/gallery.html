<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anna & Joels bröllop</title>
    <link rel="stylesheet" href="/StyleSheet.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Darumadrop+One&family=Delius&family=Julius+Sans+One&family=Pacifico&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
          rel="stylesheet">
</head>
<body>
<form id="upload-form" class="uploadForm" enctype="multipart/form-data">
    <h2>Lägg till ett foto i galleriet</h2>
    <input type="file" name="image"/>
    <button type="submit">Ladda upp</button>
</form>

<div id="upload-message" style="margin-top: 1rem;"></div>
<div id="gallery" class="gallery"></div>

<script>
    loadGalleryImages();
    const uploadForm = document.getElementById('upload-form');
    const gallery = document.getElementById('gallery');
    const uploadMessage = document.getElementById('upload-message');

    if (uploadForm) {
        uploadForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            console.log("Form submitted");

            const formData = new FormData(uploadForm);

            try {
                const response = await fetch('/gallery', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    uploadMessage.textContent = result.message;

                    const img = document.createElement('img');
                    img.src = result.url;
                    img.alt = 'Uppladdad bild';
                    gallery.appendChild(img);

                    uploadForm.reset();
                } else {
                    uploadMessage.textContent = 'Fel: ' + (result.message || 'Något gick fel');
                }
            } catch (error) {
                console.error(error);
                uploadMessage.textContent = 'Fel vid uppladdning';
            }
        });
    }

    async function loadGalleryImages() {
        try {
            const response = await fetch('/api/gallery');
            const images = await response.json();

            const gallery = document.getElementById('gallery');
            gallery.innerHTML = ''; // Töm galleriet först

            images.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.alt = 'Uppladdad bild';
                gallery.appendChild(img);
            });
        } catch (error) {
            console.error('Kunde inte ladda bilder:', error);
        }
    }
</script>
</body>
</html>
